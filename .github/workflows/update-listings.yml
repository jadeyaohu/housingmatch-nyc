# Keeps the site's listing data fresh with no manual steps:
#  - daily: re-download NYC Open Data
#  - whenever Muse uploads a CSV to data/inbox/: validate and publish it
# Commits data/ when it changes, which triggers a Vercel redeploy.
# GitHub emails the repo owner only if this workflow fails.
name: Update listings
on:
  schedule:
    - cron: "17 11 * * 1,4" # Mondays and Thursdays ~6am New York
  push:
    branches: [main]
    paths: ["data/inbox/**.csv"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-listings
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Open Data (daily run only)
        if: github.event_name != 'push'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then npm run import -- --fetch --supabase; else npm run import -- --fetch; fi
      - name: Muse inbox
        run: npm run ingest:muse
      - run: npm test
      - name: Commit if changed
        run: |
          git config user.name "listings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/ src/lib/data/zip-districts.json
          git diff --cached --quiet || git commit -m "data: update listings $(date -u +%FT%H:%MZ)"
          git pull --rebase
          git push
